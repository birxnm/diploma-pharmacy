# PHA2-22 - Last updated: 2026-10-20
#
# Continuous integration for PharmaStock (NFR-08): the automated tests of the
# backend and of the forecasting module run on every pull request and on every
# push to main. The two test jobs are the required checks for merging into
# main; the lint job is advisory for now (see the comment on that job and
# docs/project-management/ci.md).

name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with test dependencies
        run: pip install -e ".[dev]"

      # The backend tests run against an in-memory SQLite database and need no
      # PostgreSQL service; DATABASE_URL is set inside the tests themselves.
      - name: Run backend tests
        run: pytest -q

  forecasting-tests:
    name: forecasting-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forecasting
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecasting/pyproject.toml

      - name: Install forecasting package with test dependencies
        run: pip install -e ".[dev]"

      - name: Run forecasting tests
        run: pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory for now. ruff is installed unpinned and runs with its default
    # rule set, which in current releases (0.17 at the time of writing) covers
    # several hundred rules. On the present scaffold the defaults report style
    # findings (import order, Decimal constructor style, quoted annotations);
    # the classic pyflakes/pycodestyle subset (E4, E7, E9, F) passes. Until the
    # team agrees on a shared [tool.ruff] configuration in each package's
    # pyproject.toml and fixes the findings, a lint failure must not block a
    # merge, so the job reports its result without failing the workflow run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check (default rules)
        run: ruff check backend/ forecasting/
