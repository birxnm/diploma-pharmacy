# PHA2-3 - Last updated: 2026-10-19
# Alembic configuration of the PharmaStock backend. Run the commands from backend/:
#
#   alembic revision --autogenerate -m "describe the change"
#   alembic upgrade head
#   alembic downgrade -1
#
# The database URL is NOT stored in this file: alembic/env.py takes it from the
# application settings (DATABASE_URL in .env), so no credentials end up in Git.

[alembic]
# Location of env.py, script.py.mako and the versions/ directory, relative to this file.
script_location = %(here)s/alembic

# Migration file names: 20261019_1430_<rev>_<slug>.py, sorted chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

# Make the `app` package importable from env.py wherever alembic is invoked.
prepend_sys_path = %(here)s
path_separator = os

# Set at runtime by alembic/env.py from settings.database_url.
sqlalchemy.url =


[post_write_hooks]
# No formatting hooks yet.


# --- Logging ------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
